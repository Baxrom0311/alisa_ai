[project]
# Path to the repository you want the agents to build.
path = "."
# Write your product/project explanation here.
brief_file = "PROJECT_BRIEF.md"
# Set this to your real verification command, e.g. "pytest -q", "npm test".
test_command = "cd backend && ./venv/bin/python -m pytest -q"
logs_dir = ".agentloop/runs"

[loop]
# Outer loop: how many times Kiro creates/updates the plan.
plan_cycles = 3
# Middle loop: how many Codex-Kiro review rounds per plan cycle.
review_cycles = 5
# Inner loop: how many times Codex builds before Kiro reviews.
build_iterations = 10
# Stop build phase if Codex produces no changes for this many consecutive iterations.
no_change_limit = 2
sleep_between_rounds_sec = 1
# Safety: max total builds across all cycles (prevents infinite loops).
max_total_builds = 50
# How many discovery rounds to run after "done" before truly stopping.
max_discovery_rounds = 2

[kiro]
# Kiro is the PLANNER and REVIEWER (uses Opus model).
enabled = true
command = "kiro-cli"
agent = "ai-planner"
timeout_sec = 3600
resume = false
# trust-all-tools needed for non-interactive mode
trust_tools = ""
trust_all_tools = true
require_mcp_startup = false
instruction_arg = "Follow the orchestration instructions from STDIN exactly."

[codex]
# Codex is the BUILDER / code writer.
enabled = true
command = "codex"
timeout_sec = 3600
# Builder needs write access.
sandbox = "workspace-write"

[telegram]
# Set enabled = true and fill bot_token + chat_id to receive live updates.
# You can also set TG_BOT_TOKEN and TG_CHAT_ID environment variables.
enabled = true
bot_token = "8860807129:AAF0p6MJbHeARftMYoL1JLcB6nGy2js8Iuw"
chat_id = "5146421024"

[git]
# When done=true, automatically push to GitHub.
auto_push = true
branch = "main"
# Leave empty for auto-generated commit message.
commit_message = ""
