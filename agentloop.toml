[project]
path = "."
brief_file = "PROJECT_BRIEF.md"
test_command = "python -m pytest tests/ -q --tb=short 2>/dev/null || echo 'NO_TESTS_YET'"
logs_dir = ".agentloop/runs"

[loop]
plan_cycles = 10
review_cycles = 5
build_iterations = 10
no_change_limit = 2
sleep_between_rounds_sec = 1
max_total_builds = 200
max_discovery_rounds = 3

[parallel]
# Bir vaqtda nechta builder ishlaydi (1 = ketma-ket, 3 = paralel)
builders = 3

[kiro]
enabled = true
command = "kiro-cli"
agent = "ai-planner"
timeout_sec = 3600
resume = false
trust_tools = ""
trust_all_tools = true
require_mcp_startup = false
instruction_arg = "Follow the orchestration instructions from STDIN exactly."

[codex]
# Now uses Kiro ai-builder instead of Codex
enabled = true
command = "kiro-cli"
agent = "ai-builder"
timeout_sec = 3600
trust_all_tools = true

[telegram]
enabled = true
# Use TELEGRAM_BOT_TOKEN environment variable
bot_token = "REMOVED_FOR_SECURITY"
# Use TELEGRAM_CHAT_ID environment variable  
chat_id = "REMOVED_FOR_SECURITY"

[git]
auto_push = true
branch = "main"
commit_message = ""
